name: Publish the quiz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-sleep-quiz
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Update the Pages publishing branch and request a build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          main_sha=$(gh api "$repo/git/ref/heads/main" --jq .object.sha)
          gh api --method PATCH "$repo/git/refs/heads/gh-pages" -f sha="$main_sha" -F force=false --silent
          gh api --method POST "$repo/pages/builds" --silent
