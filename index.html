<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Patterns Diagnostic Tool | Cloud Forest</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8fafc; color: #172033; font: 1rem/1.55 system-ui, sans-serif; }
    body > div { max-width: 48rem; margin: auto; padding: clamp(1rem, 3vw, 2rem); }
    header { margin: 1rem 0 2rem; text-align: center; }
    h1, h2, h3, h4, p, ul { margin: 0; }
    h1, h2, h3, h4 { line-height: 1.25; }
    h1 { font-size: clamp(2rem, 5vw, 2.5rem); color: #1e4081; }
    h2 { font-size: 1.875rem; color: #1e4081; }
    h3 { font-size: 1.375rem; }
    h4 { font-size: 1.125rem; }
    .text-sm { font-size: .9rem; }
    .text-lg { font-size: 1.125rem; }
    .text-gray-500, .text-gray-600 { color: #4b5563; }
    .mb-2 { margin-bottom: .5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mt-1 { margin-top: .25rem; }
    .mt-2 { margin-top: .5rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-6, .mt-10 { margin-top: 1.5rem; }
    .p-4 { padding: 1rem; }
    .p-6 { padding: clamp(1rem, 3vw, 1.5rem); }
    .rounded, .rounded-lg { border-radius: .65rem; }
    .bg-white { background: white; border: 1px solid #dce1e9; }
    .bg-blue-50 { background: #edf4ff; }
    .shadow { box-shadow: 0 3px 12px rgba(25, 42, 74, .06); }
    .space-y-3 > * + * { margin-top: .65rem; }
    .space-y-4 > * + * { margin-top: .85rem; }
    .space-y-6 > * + * { margin-top: 1.25rem; }
    .hidden { display: none !important; }
    ul { padding-left: 1.4rem; }
    button { font: inherit; cursor: pointer; color: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 3px; }
    .quiz-option { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid #aeb9c8; }
    .nav-link { background: transparent; border: 0; color: #1e4687; text-decoration: underline; padding: .5rem 0; }
    .quiz-option.selected { border-color: #1e4687; background: #edf4ff; }
    .quiz-option:hover { background: #f1f6fd; border-color: #5282b9; }
    .time-fields, .time-actions { display: flex; align-items: center; flex-wrap: wrap; gap: .75rem; }
    .time-fields label { font-weight: 600; }
    .time-fields input { display: block; width: 6.2rem; margin-top: .35rem; padding: .65rem; font: inherit; font-weight: 400; color: inherit; background: white; border: 1px solid #8592a4; border-radius: .45rem; }
    .time-fields input:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
    .time-actions { margin-top: 1rem; }
    #submit-duration { background: #1e4687; color: white; border: 1px solid #1e4687; border-radius: .45rem; padding: .65rem 1.15rem; }
    #duration-error { color: #9e2929; }
    #duration-error:empty { display: none; }
    .review-actions { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; margin-top: .5rem; }
    .report-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem; }
    .report-actions button { border: 1px solid #1e4687; border-radius: .45rem; padding: .65rem 1.15rem; color: #1e4687; background: white; }
    .report-actions button:first-child { color: white; background: #1e4687; }
    #report-status:empty { display: none; }
    @media print {
      body { background: white; color: black; font: 11pt/1.4 system-ui, sans-serif; }
      body > div { max-width: none; padding: 0; }
      header { margin: 0 0 1rem; }
      #report-section, button { display: none !important; }
      .bg-white, .bg-blue-50 { border: 0; box-shadow: none; padding: 0; }
      h2, h3, h4 { break-after: avoid; }
      li, p { orphans: 2; widows: 2; }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-3xl mx-auto p-6">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-bold text-blue-800">Sleep Patterns Diagnostic</h1>
      <p class="text-lg mt-2 text-gray-600">Think about your sleep over the past two weeks.</p>
      <p class="text-sm mt-1">From the Cloud Forest Sleep Patterns Field Guide. This quiz describes adult sleep schedules for educational use.</p>
    </header>

    <noscript><p>This quiz uses JavaScript to show questions and calculate your result. Enable JavaScript in your browser to start.</p></noscript>
    <div id="quiz-section" class="space-y-8">
      <!-- Questions will be injected here -->
    </div>

    <div id="results-section" class="hidden space-y-6">
      <h2 class="text-3xl font-bold text-blue-800">Your Results</h2>
      <div id="pattern-summary" class="bg-white p-6 rounded-lg shadow"></div>
      <div id="detailed-info" class="bg-white p-6 rounded-lg shadow space-y-4"></div>
      <div id="traditions" class="bg-white p-6 rounded-lg shadow"></div>
    </div>

    <section id="report-section" class="hidden mt-10 bg-white p-6 rounded-lg shadow" aria-labelledby="report-heading">
      <h3 id="report-heading">Save your results</h3>
      <p class="mt-2">Download your sleep pattern and quiz answers to your device.</p>
      <div class="report-actions">
        <button id="download-pdf" type="button">Download PDF</button>
        <button id="print-results" type="button">Print results</button>
        <button id="restart-quiz" type="button">Retake quiz</button>
      </div>
      <p id="report-status" role="status" class="mt-4 text-sm"></p>
    </section>
  </div>

  <script>
    const questions = [
      {
        id: 'layout',
        q: 'How did you usually get most of your sleep?',
        help: 'If you work nights, count your daytime sleep. A quick bathroom break counts as part of the same stretch.',
        opts: [
          { l: 'A', t: 'One main stretch' },
          { l: 'B', t: 'Two main stretches, with a long break awake in between' },
          { l: 'C', t: 'Three or more shorter sleeps around the clock, with no main stretch' },
          { l: 'D', t: 'I switched between patterns' },
          { l: 'E', t: 'I can’t remember' }
        ]
      },
      {
        id: 'naps',
        q: 'On how many of the last 14 days did you nap?',
        opts: [
          { l: 'A', t: '0 days' },
          { l: 'B', t: '1–7 days' },
          { l: 'C', t: '8–14 days' },
          { l: 'D', t: 'I can’t remember' }
        ]
      },
      {
        id: 'napType',
        q: 'What were your naps usually like?',
        opts: [
          { l: 'A', t: 'One nap, 30 minutes or less' },
          { l: 'B', t: 'One nap, 31–59 minutes' },
          { l: 'C', t: 'One nap, an hour or more around midday' },
          { l: 'D', t: 'One nap, an hour or more at another time' },
          { l: 'E', t: 'Two or more naps' },
          { l: 'F', t: 'It varied from day to day' }
        ]
      },
      {
        id: 'total',
        type: 'duration',
        q: 'How much sleep did you usually get in 24 hours?',
        help: 'Include naps. Your best estimate is fine.'
      },
      {
        id: 'alertness',
        q: 'Did you stay awake most afternoons?',
        opts: [
          { l: 'A', t: 'I stayed awake easily' },
          { l: 'B', t: 'I stayed awake, but it took effort' },
          { l: 'C', t: 'I dozed off without meaning to' },
          { l: 'D', t: 'I was asleep as part of my usual schedule' },
          { l: 'E', t: 'There was no usual pattern' }
        ]
      },
      {
        id: 'schedule',
        q: 'Which schedule comes closest to yours?',
        opts: [
          { l: 'B', t: 'Three sleeps of 90 minutes to 2 hours each, evenly spaced' },
          { l: 'C', t: 'One 3-hour sleep plus three 20-minute naps' },
          { l: 'E', t: 'Six 20-minute naps or four 30-minute naps, evenly spaced across 24 hours' },
          { l: 'A', t: 'No clear match' }
        ]
      }
    ];

    const patterns = {
      monophasic: {
        name: "Monophasic",
        desc: "You usually get your sleep in one main stretch.",
        track: ["Record when you fall asleep and when you wake for the day.", "Compare workdays with days when you can wake without an alarm."],
        watch: ["A single block can still be short. Check how much time you actually spend asleep."]
      },
      biphasic_siesta: {
        name: "Biphasic (Siesta)",
        desc: "Your usual day includes a main sleep and a longer daytime sleep.",
        track: ["Record the start and end of both sleeps.", "Compare days when you can take your usual siesta with days when you miss it."],
        watch: ["Notice whether your bedtime shifts after a later daytime sleep."]
      },
      biphasic_nap: {
        name: "Biphasic (Nap)",
        desc: "Your usual day includes a main sleep and a short nap.",
        track: ["Record how long the nap lasts and how you feel afterward."],
        watch: ["Distinguish a nap you planned from a time you fell asleep without meaning to."]
      },
      segmented: {
        name: "Segmented",
        desc: "You usually sleep for a stretch, spend some time awake, then go back to sleep.",
        track: ["Write down when you wake between the two periods and when you fall asleep again."],
        watch: ["Count the time asleep in both periods. Time awake between them can make time in bed a misleading total.", "If the waking bothers you or interferes with your day, mention it at a healthcare visit."]
      },
      segmented_naps: {
        name: "Segmented plus Naps (Mixed)",
        desc: "You usually sleep in two stretches with time awake in between. You also nap on most days.",
        track: ["Write down both stretches and any extra naps separately."],
        watch: ["Notice how long you spend awake between stretches and whether you planned to nap."]
      },
      triphasic: {
        name: "Triphasic",
        desc: "You described three distinct sleep periods in a typical 24 hours.",
        track: ["Record the timing and length of each sleep period and add up the hours."],
        watch: ["Three sleep periods alone tell you little about whether you get enough sleep."]
      },
      everyman: {
        name: "Everyman-style schedule",
        desc: "The Field Guide uses this name for a short core sleep with several short, scheduled naps.",
        track: ["Include each nap you actually take when you add up your daily sleep."],
        watch: ["Schedules built around a short core sleep and brief naps can leave too little time asleep."]
      },
      uberman: {
        name: "Uberman / Dymaxion-style schedule",
        desc: "The Field Guide groups these schedules together because sleep is divided into short, regularly spaced naps without a main sleep.",
        track: ["Count each sleep episode across a full 24 hours."],
        watch: ["A naps-only schedule can leave you severely short of sleep."]
      },
      irregular: {
        name: "Irregular sleep schedule",
        desc: "The timing or arrangement of your sleep varies substantially from day to day.",
        track: ["Keep a diary across both workdays and days off.", "Note shifts, caregiving or other interruptions alongside the sleep times."],
        watch: ["A changing schedule can make your total hours and episodes of daytime sleepiness easy to overlook."]
      },
      biphasic_other: {
        name: "Biphasic (Main Sleep and One Nap)",
        desc: "You usually have one main sleep and one additional nap.",
        track: ["Write down when the nap starts, how long you sleep and when you next go to bed."],
        watch: ["Include naps on both workdays and free days when comparing your totals."]
      },
      polyphasic_other: {
        name: "Multiple Sleep Periods",
        desc: "You usually sleep in three or more periods across a full day.",
        track: ["Add up the time you actually spend asleep across all periods."],
        watch: ["The number of sleep periods alone tells you little about total sleep or daytime alertness."]
      },
      occasional_naps: {
        name: "One main sleep, with occasional naps",
        desc: "Most of your sleep comes in one stretch. On some days, you also take a nap.",
        track: ["Record when you sleep and which days you nap."],
        watch: ["See whether you nap more often on days off or after a shorter sleep."]
      },
      main_sleep: {
        name: "One main stretch of sleep",
        desc: "You usually get most of your sleep in one stretch.",
        track: ["Write down your main sleep and any naps."],
        watch: ["See whether your naps follow a pattern across the week."]
      },
      unclear: {
        name: "No clear pattern yet",
        desc: "Your answers leave a few details open. A few days of sleep and wake times may help you see a pattern.",
        track: ["Try writing down when you fell asleep, when you got up and any naps you took."],
        watch: ["See whether workdays and days off look different in your notes."]
      }
    };

    let answers = {};
    let current = 0;
    let editingResult = false;

    function activeQuestions() {
      const hasMainSleep = ['A', 'B'].includes(answers.layout);
      return questions.filter(question => {
        if (question.id === 'naps') return hasMainSleep;
        if (question.id === 'napType') return answers.layout === 'A' && answers.naps === 'C';
        if (question.id === 'schedule') {
          return answers.layout === 'C' ||
            (answers.layout === 'A' && answers.naps === 'C' && answers.napType === 'E');
        }
        return true;
      });
    }

    function optionsFor(question) {
      if (question.id !== 'schedule') return question.opts;
      const choices = answers.layout === 'C' ? ['A', 'B', 'E'] : ['A', 'C'];
      return question.opts.filter(option => choices.includes(option.l));
    }

    function answerText(id) {
      if (id === 'total') {
        if (answers.total === 'unknown') return 'Couldn’t estimate';
        const hours = Math.floor(answers.total / 60);
        const minutes = answers.total % 60;
        return [
          hours && (hours + (hours === 1 ? ' hour' : ' hours')),
          minutes && (minutes + (minutes === 1 ? ' minute' : ' minutes'))
        ].filter(Boolean).join(' ');
      }
      const question = questions.find(item => item.id === id);
      return question.opts.find(option => option.l === answers[id])?.t || '';
    }

    function durationForm() {
      const hasEstimate = Number.isInteger(answers.total);
      const hours = hasEstimate ? Math.floor(answers.total / 60) : '';
      const minutes = hasEstimate ? answers.total % 60 : '';
      return `
        <form id="duration-form" aria-labelledby="current-question">
          <div class="time-fields">
            <label for="sleep-hours">Hours
              <input id="sleep-hours" type="number" inputmode="numeric" min="0" max="24" step="1" placeholder="0" value="${hours}">
            </label>
            <label for="sleep-minutes">Minutes
              <input id="sleep-minutes" type="number" inputmode="numeric" min="0" max="59" step="1" placeholder="0" value="${minutes}">
            </label>
          </div>
          <p id="duration-error" class="text-sm mt-2" role="alert"></p>
          <div class="time-actions">
            <button id="submit-duration" type="submit">Continue</button>
            <button id="unknown-duration" type="button" class="nav-link" aria-pressed="${answers.total === 'unknown'}">I’m not sure</button>
          </div>
        </form>`;
    }

    function renderQuestion(moveFocus = false) {
      const section = document.getElementById('quiz-section');
      const route = activeQuestions();
      if (current >= route.length) {
        editingResult = false;
        showResults();
        const heading = document.querySelector('#results-section h2');
        heading.tabIndex = -1;
        heading.focus();
        return;
      }
      const question = route[current];
      const help = question.id === 'naps' && answers.layout === 'B'
        ? 'Count only naps outside your two main stretches of sleep.'
        : question.help;
      section.innerHTML = `
        <div data-question-id="${question.id}" class="bg-white p-6 rounded-lg shadow">
          <p id="question-progress" class="text-sm text-gray-500 mb-2">Question ${current + 1}</p>
          <h3 id="current-question" tabindex="-1" aria-describedby="question-progress${help ? ' question-help' : ''}" class="text-xl font-semibold mb-4">${question.q}</h3>
          ${help ? `<p id="question-help" class="text-gray-600 mb-4">${help}</p>` : ''}
          ${question.type === 'duration' ? durationForm() : `<div class="space-y-3">
            ${optionsFor(question).map(option => `
              <button type="button" class="quiz-option w-full text-left p-4 border rounded-lg hover:border-blue-400${answers[question.id] === option.l ? ' selected' : ''}" data-letter="${option.l}" aria-pressed="${answers[question.id] === option.l}">${option.t}</button>
            `).join('')}
          </div>`}
          ${current > 0 ? '<button type="button" id="previous-question" class="nav-link mt-4">Back</button>' : ''}
        </div>`;
      if (moveFocus) section.querySelector('h3').focus();
    }

    function recordAnswer(value) {
      const question = activeQuestions()[current];
      answers[question.id] = value;
      const route = activeQuestions();
      for (const id of Object.keys(answers)) {
        const item = route.find(question => question.id === id);
        if (!item || (item.type !== 'duration' && !optionsFor(item).some(option => option.l === answers[id]))) {
          delete answers[id];
        }
      }
      if (editingResult) {
        const unanswered = route.findIndex(item => answers[item.id] === undefined);
        current = unanswered === -1 ? route.length : unanswered;
      } else {
        current++;
      }
      renderQuestion(true);
    }

    const quizSection = document.getElementById('quiz-section');
    quizSection.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.id === 'previous-question') {
        current--;
        renderQuestion(true);
      } else if (button.id === 'unknown-duration') {
        recordAnswer('unknown');
      } else if (button.dataset.letter) {
        recordAnswer(button.dataset.letter);
      }
    });

    quizSection.addEventListener('submit', event => {
      if (event.target.id !== 'duration-form') return;
      event.preventDefault();
      const hours = document.getElementById('sleep-hours');
      const minutes = document.getElementById('sleep-minutes');
      const total = Number(hours.value) * 60 + Number(minutes.value);
      if (total < 1 || total > 1440) {
        const error = document.getElementById('duration-error');
        error.textContent = total < 1
          ? 'Enter your sleep time, or choose “I’m not sure.”'
          : 'The total must fit within 24 hours.';
        hours.setAttribute('aria-describedby', 'duration-error');
        hours.focus();
        return;
      }
      recordAnswer(total);
    });

    quizSection.addEventListener('input', event => {
      if (event.target.closest('#duration-form')) {
        document.getElementById('duration-error').textContent = '';
        document.getElementById('sleep-hours').removeAttribute('aria-describedby');
      }
    });

    function openQuiz() {
      document.getElementById('report-status').textContent = '';
      document.getElementById('report-section').classList.add('hidden');
      document.getElementById('results-section').classList.add('hidden');
      document.getElementById('quiz-section').classList.remove('hidden');
      renderQuestion(true);
    }

    document.getElementById('pattern-summary').addEventListener('click', event => {
      const button = event.target.closest('button[data-edit]');
      if (!button) return;
      current = activeQuestions().findIndex(question => question.id === button.dataset.edit);
      if (current < 0) return;
      editingResult = true;
      openQuiz();
    });

    function assessPattern(answers) {
      const { layout, naps, napType, total, schedule } = answers;
      const hasTotal = Number.isInteger(total) && total > 0 && total <= 1440;
      const regularNaps = layout === 'A' && naps === 'C';
      const nap = regularNaps ? napType : undefined;
      const unclear = (reason, ...edit) => ({ key: 'unclear', reason, edit });

      // Allow 15 minutes for estimates before flagging a nap longer than the daily total.
      const minimumNap = { B: 30, C: 60, D: 60 }[nap];
      if (hasTotal && minimumNap && total < minimumNap - 15) {
        const duration = minimumNap === 60 ? 'an hour or more' : 'over half an hour';
        return unclear(`You described a nap of ${duration}. Your 24-hour total should include that nap and your main sleep.`, 'napType', 'total');
      }

      // Compare only schedules explicitly chosen on the active route. The limits
      // are their stated durations in minutes, with leeway for the visitor's estimate.
      const schedules = {
        B: { key: 'triphasic', layout: 'C', min: 270, max: 360, leeway: 45,
          reason: 'Three sleeps of 90 minutes to two hours add up to about four and a half to six hours. Check which schedule or total fits your usual day.' },
        C: { key: 'everyman', layout: 'A', min: 240, max: 240, leeway: 45,
          reason: 'A three-hour sleep and three 20-minute naps add up to about four hours. Check which schedule or total fits your usual day.' },
        E: { key: 'uberman', layout: 'C', min: 120, max: 120, leeway: 30,
          reason: 'Six 20-minute naps or four half-hour naps add up to about two hours. Check which schedule or total fits your usual day.' }
      };
      const eligible = layout === 'C' || (regularNaps && nap === 'E');
      const selected = eligible && schedules[schedule];
      if (selected && selected.layout === layout) {
        if (hasTotal && (total < selected.min - selected.leeway || total > selected.max + selected.leeway)) {
          return unclear(selected.reason, 'total', 'schedule');
        }
        return { key: selected.key };
      }

      if (layout === 'D') return { key: 'irregular' };
      if (layout === 'C') return { key: 'polyphasic_other' };
      if (layout === 'B') return { key: naps === 'C' ? 'segmented_naps' : 'segmented' };
      if (layout === 'A') {
        if (naps === 'A') return { key: 'monophasic' };
        if (naps === 'B') return { key: 'occasional_naps' };
        const napResults = {
          A: 'biphasic_nap', B: 'biphasic_other', C: 'biphasic_siesta',
          D: 'biphasic_other', E: 'polyphasic_other'
        };
        return { key: napResults[nap] || 'main_sleep' };
      }
      return unclear('There are too few details to describe a usual sleep pattern. You can revisit the first question if one of the choices sounds familiar.', 'layout');
    }

    function showResults() {
      document.getElementById('quiz-section').classList.add('hidden');
      const { key, reason, edit = [] } = assessPattern(answers);
      const p = patterns[key];
      const editLabels = {
        layout: 'Review my usual sleep',
        total: 'Review my total hours', naps: 'Review how often I napped',
        napType: 'Review my naps', schedule: 'Review my schedule'
      };
      const occasionalNote = key === 'segmented' && answers.naps === 'B' ? ' You also took a nap on some days.' : '';
      const sum = document.getElementById('pattern-summary');
      sum.innerHTML = `
        <h3 class="text-2xl font-bold">${p.name}</h3>
        <p class="mt-2 text-lg">${reason || p.desc}${occasionalNote}</p>
        ${edit.length ? `<div class="review-actions">${edit.map(id => `<button class="nav-link review-answer" data-edit="${id}" type="button">${editLabels[id]}</button>`).join('')}</div>` : ''}
        <p class="mt-4"><strong>Your sleep in 24 hours</strong><br>${answerText('total')}</p>
        <p class="mt-2"><strong>How you felt in the afternoon</strong><br>${answerText('alertness')}</p>
      `;

      const det = document.getElementById('detailed-info');
      det.innerHTML = `
        <h3 class="text-xl font-semibold">What to track</h3>
        <ul class="list-disc pl-5">${p.track.map(item => `<li>${item}</li>`).join('')}</ul>
        <h3 class="text-xl font-semibold mt-4">What to watch for</h3>
        <ul class="list-disc pl-5">${p.watch.map(item => `<li>${item}</li>`).join('')}</ul>
        <div class="mt-6 p-4 bg-blue-50 rounded">
          <h4 class="font-semibold">Putting your result in context</h4>
          <p class="mt-2">Most adults ages 18–60 need at least seven hours of sleep each night. Age, sleep quality and how you feel during the day matter too.</p>
          <p class="mt-2">If you often doze off unintentionally or regularly feel tired after a full night, discuss it with a healthcare professional. Avoid driving when you feel sleepy.</p>
          <p class="mt-2">Research has found no established benefit from cutting sleep into multiple short sessions to gain waking hours.</p>
          <p class="mt-2 text-sm"><a href="https://www.cdc.gov/sleep/about/">CDC adult sleep guidance</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/33795195/">Sleep timing consensus report</a></p>
        </div>
      `;
      document.getElementById('traditions').innerHTML = `
        <h3 class="text-xl font-semibold">From the Sleep Patterns Field Guide</h3>
        <p class="mt-2">The guide also explores rest through Western astrology, the traditional Chinese body clock and Human Design. You can use those traditions as prompts for reflection. Your quiz result comes from the sleep schedule you described.</p>
      `;
      document.getElementById('results-section').classList.remove('hidden');
      document.getElementById('report-section').classList.remove('hidden');
      window.currentPattern = key;
    }

    // The report uses standard PDF fonts and ASCII content so byte offsets stay exact.
    function reportPdf() {
      const context = document.createElement('canvas').getContext('2d');
      const pages = [[]];
      let y = 742;

      function pdfText(value) {
        return value.replace(/[–—−]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
          .normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7e]/g, ' ');
      }

      function escapeText(value) {
        return value.replace(/[()\\]/g, '\\$&');
      }

      function paragraph(value, size = 11, bold = false, indent = 0, gap = 4) {
        const leading = size + 4;
        context.font = (bold ? 'bold ' : '') + size + 'px Arial, sans-serif';
        const words = pdfText(value).trim().split(/\s+/);
        let line = '';
        function writeLine() {
          if (y < 56 || (bold && y < 90)) { pages.push([]); y = 742; }
          pages[pages.length - 1].push(
            'BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf 1 0 0 1 ' +
            (48 + indent) + ' ' + y + ' Tm (' + escapeText(line) + ') Tj ET'
          );
          y -= leading;
          line = '';
        }
        for (const word of words) {
          const next = line ? line + ' ' + word : word;
          if (line && context.measureText(next).width > 505 - indent) writeLine();
          line = line ? line + ' ' + word : word;
        }
        if (line) writeLine();
        y -= gap;
      }

      paragraph('Cloud Forest | Sleep Patterns Field Guide', 10);
      paragraph('Your sleep pattern report', 21, true, 0, 9);
      const resultNodes = document.querySelectorAll('#results-section h3, #results-section h4, #results-section p, #results-section li');
      for (const node of resultNodes) {
        if (node.matches('h3, h4')) paragraph(node.innerText, 14, true);
        else if (node.matches('li')) paragraph('- ' + node.innerText, 11, false, 8, 2);
        else paragraph(node.innerText);
      }
      pages.push([]);
      y = 742;
      paragraph('Your quiz answers', 18, true, 0, 9);
      activeQuestions().forEach((question, i) => {
        paragraph((i + 1) + '. ' + question.q, 11, true, 0, 1);
        paragraph(answerText(question.id), 11, false, 12, 6);
      });

      const objects = [];
      const pageIds = pages.map((_, i) => 5 + i * 2);
      objects.push('<< /Type /Catalog /Pages 2 0 R >>');
      objects.push('<< /Type /Pages /Count ' + pages.length + ' /Kids [' + pageIds.map(id => id + ' 0 R').join(' ') + '] >>');
      objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
      objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
      pages.forEach((lines, i) => {
        lines.push('BT /F1 9 Tf 1 0 0 1 48 32 Tm (Cloud Forest  |  ' + (i + 1) + ' of ' + pages.length + ') Tj ET');
        const stream = lines.join('\n') + '\n';
        objects.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + (pageIds[i] + 1) + ' 0 R >>');
        objects.push('<< /Length ' + stream.length + ' >>\nstream\n' + stream + 'endstream');
      });
      let file = '%PDF-1.4\n';
      const offsets = [0];
      objects.forEach((object, i) => {
        offsets.push(file.length);
        file += (i + 1) + ' 0 obj\n' + object + '\nendobj\n';
      });
      const startXref = file.length;
      file += 'xref\n0 ' + offsets.length + '\n0000000000 65535 f \n';
      for (const offset of offsets.slice(1)) file += String(offset).padStart(10, '0') + ' 00000 n \n';
      file += 'trailer\n<< /Size ' + offsets.length + ' /Root 1 0 R >>\nstartxref\n' + startXref + '\n%%EOF\n';
      return new Blob([file], { type: 'application/pdf' });
    }

    document.getElementById('download-pdf').addEventListener('click', () => {
      const status = document.getElementById('report-status');
      try {
        const url = URL.createObjectURL(reportPdf());
        const link = document.createElement('a');
        link.href = url;
        link.download = 'Sleep-Pattern-Report-' + window.currentPattern + '.pdf';
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        status.textContent = 'Your PDF is ready. If the download did not open, choose Print results to save a copy.';
      } catch {
        status.textContent = 'The PDF download is unavailable in this browser. Choose Print results to save a copy.';
      }
    });
    document.getElementById('print-results').addEventListener('click', () => window.print());

    document.getElementById('restart-quiz').addEventListener('click', () => {
      answers = {};
      current = 0;
      editingResult = false;
      openQuiz();
    });

    renderQuestion();
  </script>
</body>
